  &lt;script&gt;
    (() =&gt; {

      const screen = root.querySelector(&#x27;#screenshot-search-screen&#x27;);

      const items = [

        {

          title: &#x27;Limonlu pasta tarifi&#x27;,
          intent: &#x27;Dene&#x27;,
          intentKey: &#x27;try&#x27;,
          age: &#x27;Geçen ay&#x27;,

        {
          id: &#x27;shoes&#x27;,
          title: &#x27;Mavi spor ayakkabı&#x27;,
          intent: &#x27;Al / Bak&#x27;,
          intentKey: &#x27;buy&#x27;,
          age: &#x27;8 gün önce&#x27;,
          icon: &#x27;shopping-bag&#x27;,
          reason: &#x27;Ürün görseli ve “indirim” metni eşleşti.&#x27;,
          detail: &#x27;Koşu ayakkabısı · Mavi · %20 indirim&#x27;

      const state = {
        page: 0,
        returnPage: 2,
        privacyOpen: false,
        denied: false,
        query: &#x27;&#x27;,
        results: items,
        selected: items[0],
        itemStatus: &#x27;&#x27;

      const pageNames = [&#x27;Başlangıç&#x27;, &#x27;İlk sonuç&#x27;, &#x27;Bugün&#x27;, &#x27;Ara&#x27;, &#x27;Detay&#x27;];

      function renderOnboarding() {
        return `

            &lt;h2&gt;Aldığın screenshotlar kaybolmasın.&lt;/h2&gt;

      function renderSummary() {

      function renderHome() {
        return `

      function renderSearch() {

          &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-action=&quot;back&quot;&gt;${icon(&#x27;arrow-left&#x27;)} Geri&lt;/button&gt;
          &lt;div class=&quot;capture-visual&quot; role=&quot;img&quot; aria-label=&quot;${item.title} screenshotının temsili önizlemesi&quot;&gt;
            &lt;div class=&quot;capture-sheet&quot; aria-hidden=&quot;true&quot;&gt;
              &lt;span class=&quot;item-title&quot;&gt;${item.title}&lt;/span&gt;
              &lt;span class=&quot;capture-line&quot;&gt;&lt;/span&gt;
              &lt;span class=&quot;capture-line medium&quot;&gt;&lt;/span&gt;
              &lt;span class=&quot;capture-line short&quot;&gt;&lt;/span&gt;
              &lt;span class=&quot;item-meta text-small&quot;&gt;${item.detail}&lt;/span&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;intro-copy&quot;&gt;
            &lt;div class=&quot;match-line&quot;&gt;
              &lt;span class=&quot;viz-badge&quot;&gt;${item.intent}&lt;/span&gt;
              &lt;span class=&quot;secondary-copy text-small&quot;&gt;${item.age}&lt;/span&gt;
            &lt;/div&gt;
            &lt;h2&gt;${item.title}&lt;/h2&gt;
            &lt;p class=&quot;secondary-copy&quot;&gt;${item.reason}&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;action-row&quot; aria-label=&quot;Screenshot eylemleri&quot;&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-status=&quot;İlgileniyorum&quot;&gt;İlgileniyorum&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-status=&quot;Bir sonraki özette gösterilecek&quot;&gt;Sonra göster&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-status=&quot;Tamamlandı&quot;&gt;Tamamlandı&lt;/button&gt;
            &lt;button type=&quot;button&quot; class=&quot;btn btn-ghost&quot; data-status=&quot;Arşivlendi&quot;&gt;Arşivle&lt;/button&gt;
          &lt;/div&gt;
          ${state.itemStatus ? `&lt;p class=&quot;selected-status&quot;&gt;${state.itemStatus}&lt;/p&gt;` : &#x27;&#x27;}
          &lt;div class=&quot;status-copy&quot;&gt;
            &lt;label class=&quot;form-label&quot; for=&quot;intent-correction&quot;&gt;Yanlış mı? Niyeti değiştir&lt;/label&gt;
            &lt;select id=&quot;intent-correction&quot; class=&quot;form-select&quot; data-intent-select&gt;
              ${[&#x27;Git&#x27;, &#x27;Dene&#x27;, &#x27;Al / Bak&#x27;, &#x27;Oku / İzle&#x27;, &#x27;Hatırla&#x27;, &#x27;Belirsiz&#x27;].map((intent) =&gt; `&lt;option ${intent === item.intent ? &#x27;selected&#x27; : &#x27;&#x27;}&gt;${intent}&lt;/option&gt;`).join(&#x27;&#x27;)}
            &lt;/select&gt;
          &lt;/div&gt;
        `;
      }

      function render() {
        const renderers = [renderOnboarding, renderSummary, renderHome, renderSearch, renderDetail];
        screen.innerHTML = renderers[state.page]();
        if (window.lucide) {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      }

      function runSearch(query) {
        const normalized = query.trim().toLocaleLowerCase(&#x27;tr-TR&#x27;);
        state.query = query.trim();
        if (!normalized) {
          state.results = items;
        } else if (normalized.includes(&#x27;pasta&#x27;) || normalized.includes(&#x27;tarif&#x27;) || normalized.includes(&#x27;limon&#x27;)) {
          state.results = [items[1]];
        } else if (normalized.includes(&#x27;kadıköy&#x27;) || normalized.includes(&#x27;kadikoy&#x27;) || normalized.includes(&#x27;mekan&#x27;) || normalized.includes(&#x27;kahve&#x27;)) {
          state.results = [items[0]];
        } else if (normalized.includes(&#x27;mavi&#x27;) || normalized.includes(&#x27;ayakkabı&#x27;) || normalized.includes(&#x27;ayakkabi&#x27;) || normalized.includes(&#x27;indirim&#x27;)) {
          state.results = [items[2]];
        } else {
          state.results = items;
        }
        state.page = 3;
        render();
      }

      root.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const actionTarget = event.target.closest(&#x27;[data-action]&#x27;);
        const detailTarget = event.target.closest(&#x27;[data-detail]&#x27;);
        const queryTarget = event.target.closest(&#x27;[data-query]&#x27;);
        const statusTarget = event.target.closest(&#x27;[data-status]&#x27;);

        if (actionTarget) {
          const action = actionTarget.dataset.action;
          if (action === &#x27;start&#x27;) permissionDialog.showModal();
          if (action === &#x27;privacy&#x27;) state.privacyOpen = !state.privacyOpen;
          if (action === &#x27;reset&#x27;) {
            state.page = 0;
            state.privacyOpen = false;
            state.denied = false;
            state.query = &#x27;&#x27;;
            state.results = items;
            state.itemStatus = &#x27;&#x27;;
          }
          if (action === &#x27;show-results&#x27; || action === &#x27;home&#x27;) state.page = 2;
          if (action === &#x27;search&#x27;) state.page = 3;
          if (action === &#x27;back&#x27;) state.page = state.returnPage;
          render();
          return;
        }

        if (detailTarget) {
          state.selected = items.find((item) =&gt; item.id === detailTarget.dataset.detail) || items[0];
          state.returnPage = state.page;
          state.itemStatus = &#x27;&#x27;;
          state.page = 4;
          render();
          return;
        }

        const categoryTarget = event.target.closest(&#x27;[data-category]&#x27;);
        if (categoryTarget) {
          const categoryMap = {
            go: items[0],
            try: items[1],
            buy: items[2],
            remember: items[0]
          };
          const selectedCategory = categoryMap[categoryTarget.dataset.category] || items[0];
          state.query = selectedCategory.intent;
          state.results = items.filter((item) =&gt; item.intentKey === selectedCategory.intentKey);
          state.page = 3;
          render();
          return;
        }

        if (queryTarget) {
          runSearch(queryTarget.dataset.query);
          return;
        }

        if (statusTarget) {
          state.itemStatus = statusTarget.dataset.status;
          render();
        }
      });

      root.addEventListener(&#x27;submit&#x27;, (event) =&gt; {
        if (!event.target.matches(&#x27;[data-search-form]&#x27;)) return;
        event.preventDefault();
        const formData = new FormData(event.target);
        runSearch(String(formData.get(&#x27;query&#x27;) || &#x27;&#x27;));
      });

      root.addEventListener(&#x27;change&#x27;, (event) =&gt; {
        if (!event.target.matches(&#x27;[data-intent-select]&#x27;)) return;
        state.selected = { ...state.selected, intent: event.target.value };
        state.itemStatus = `Niyet “${event.target.value}” olarak düzeltildi.`;
        render();
      });

      permissionDialog.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        const permissionTarget = event.target.closest(&#x27;[data-permission]&#x27;);
        if (!permissionTarget) return;
        permissionDialog.close();
        if (permissionTarget.dataset.permission === &#x27;allow&#x27;) {
          state.denied = false;
          state.page = 1;
        } else {
          state.denied = true;
          state.page = 0;
        }
        render();
      });

      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
